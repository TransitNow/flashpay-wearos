plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingPropsFile = rootProject.file("signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace 'com.jsyntax.nowtap'
    compileSdk 36

    defaultConfig {
        applicationId "com.jsyntax.nowtap"
        minSdk 28
        // Play requires a current target API for new Wear submissions; 33 is rejected outright.
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile     file(signingProps['STORE_FILE'])
                storePassword signingProps['STORE_PASSWORD']
                keyAlias      signingProps['KEY_ALIAS']
                keyPassword   signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// No dependencies on purpose. Every screen is built from framework views, so the app carries no
// androidx or Play Services code at all — which is also why it starts as fast as it does.
dependencies {
}
